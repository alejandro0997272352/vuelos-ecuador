<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VuelaLejos | Fotos por Destino</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --success: #22c55e; }
        body { font-family: 'Outfit', sans-serif; background: #020617; color: white; margin: 0; }
        
        header { 
            padding: 80px 20px; text-align: center; 
            background: linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.9)), url('https://images.unsplash.com/photo-1436491865332-7a61a109c0f3?w=1200');
            background-size: cover;
        }

        #buscador {
            background: white; max-width: 800px; margin: -40px auto 40px;
            padding: 25px; border-radius: 25px; display: flex; gap: 15px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative; z-index: 10;
        }

        #buscador input { flex: 1; padding: 15px; border: 2px solid #e2e8f0; border-radius: 15px; outline: none; color: #1e293b; font-size: 1rem; }

        .btn-search { background: var(--accent); color: white; border: none; padding: 0 30px; border-radius: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-search:hover { transform: scale(1.05); filter: brightness(1.1); }

        .grid-vuelos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        /* ANIMACIONES */
        .card { 
            background: #1e293b; border-radius: 25px; overflow: hidden; 
            opacity: 0; transform: translateY(40px); 
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card.aparecer { opacity: 1; transform: translateY(0); }

        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4); }

        .img-box { height: 200px; background: #0f172a; overflow: hidden; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }

        .info { padding: 25px; }
        .price { color: #fbbf24; font-weight: 800; font-size: 1.4rem; margin: 10px 0; }
        
        .btn-wa { 
            display: block; background: var(--success); color: white; text-align: center; 
            padding: 12px; text-decoration: none; border-radius: 15px; font-weight: 700;
        }
    </style>
</head>
<body>

<header>
    <h1>VuelaLejos World ✈️</h1>
    <p>Fotos reales de tu próximo destino</p>
</header>

<main>
    <section id="buscador">
        <input type="text" id="origen" placeholder="Desde... (ej: quito)">
        <input type="text" id="destino" placeholder="Hacia... (ej: MADRID)">
        <button class="btn-search" onclick="buscar()">BUSCAR VUELOS</button>
    </section>
    <div id="contenedor" class="grid-vuelos"></div>
</main>

<script>
    const miTelefono = "593997272352"; 
    
    function buscar() {
        const cont = document.getElementById('contenedor');
        // Limpiamos los textos para que no importe mayúsculas/minúsculas
        const oriRaw = document.getElementById('origen').value.trim() || "Ecuador";
        const desRaw = document.getElementById('destino').value.trim() || "Mundo";
        
        cont.innerHTML = ""; 

        for (let i = 0; i < 12; i++) {
            const precio = Math.floor(Math.random() * (1200 - 150) + 150);
            const aerolinea = ["LATAM", "Avianca", "Iberia", "Delta"][Math.floor(Math.random() * 4)];
            
            // USAMOS LOREMFLICKR: Busca por el nombre del destino y el 'lock' hace que las fotos sean distintas
            const fotoUrl = `https://loremflickr.com/600/400/${desRaw.toLowerCase()}?lock=${i + 10}`;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="img-box">
                    <img src="${fotoUrl}" 
                         onerror="this.src='https://images.unsplash.com/photo-1436491865332-7a61a109c0f3?w=500'"
                         alt="${desRaw}">
                </div>
                <div class="info">
                    <small style="color:var(--accent); font-weight:bold">${aerolinea}</small>
                    <h3 style="margin:8px 0; text-transform: capitalize;">${oriRaw} ➔ ${desRaw}</h3>
                    <div class="price">$${precio}</div>
                    <a href="https://wa.me/${miTelefono}?text=Vuelo de ${oriRaw} a ${desRaw}" class="btn-wa">RESERVAR AHORA</a>
                </div>
            `;
            cont.appendChild(card);

            // ANIMACIÓN DE CASCADA
            setTimeout(() => {
                card.classList.add('aparecer');
            }, i * 100); 
        }
    }

    window.onload = buscar;
</script>
</body>
</html>
